<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>UNSC // SECURE TERMINAL</title>
<meta property="og:title" content="PRIORITY TRANSMISSION — EYES ONLY">
<meta property="og:description" content="Secure UNSC terminal. Authorization required.">
<style>
/* ============================================================
   EDIT YOUR EVENT DETAILS IN THE <script> CONFIG AT THE BOTTOM
   ============================================================ */
:root{
  --void:#04070c;
  --panel:#081420;
  --phos:#79e7ff;      /* primary phosphor */
  --phos-dim:#2f6f85;
  --amber:#ffb23f;     /* alert / key data */
  --bone:#dbeef5;
  --red:#ff5a4d;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--void);
  color:var(--phos);
  font-family:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace;
  font-size:15px;
  line-height:1.55;
  overflow-x:hidden;
  -webkit-font-smoothing:none;
}
/* CRT overlays */
.scan{position:fixed;inset:0;pointer-events:none;z-index:50;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px);
  mix-blend-mode:multiply}
.vig{position:fixed;inset:0;pointer-events:none;z-index:51;
  background:radial-gradient(ellipse at center,transparent 45%,rgba(0,0,0,.85) 100%)}
.flick{position:fixed;inset:0;pointer-events:none;z-index:52;
  background:var(--phos);opacity:0;animation:flick 7s infinite steps(1)}
@keyframes flick{0%,97%{opacity:0}97.5%{opacity:.025}98%{opacity:0}98.5%{opacity:.015}99%{opacity:0}}

/* Gate */
#gate{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:26px;background:var(--void);
  text-align:center;padding:24px;cursor:pointer}
#gate .crest{font-size:11px;letter-spacing:.55em;color:var(--phos-dim)}
#gate h1{font-size:clamp(20px,5vw,34px);letter-spacing:.18em;color:var(--amber);font-weight:400}
#gate .warn{font-size:12px;color:var(--phos-dim);max-width:46ch;letter-spacing:.06em}
#gate .key{border:1px solid var(--phos);padding:12px 26px;letter-spacing:.28em;font-size:13px;
  animation:pulse 1.6s infinite ease-in-out;background:transparent;color:var(--phos);
  font-family:inherit;cursor:pointer}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:1}}
#gate.hide{opacity:0;visibility:hidden;transition:opacity .5s}

/* Terminal */
main{max-width:860px;margin:0 auto;padding:28px 20px 120px;min-height:100vh}
.bar{display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
  border-bottom:1px solid var(--phos-dim);padding-bottom:8px;margin-bottom:20px;
  font-size:11px;letter-spacing:.2em;color:var(--phos-dim)}
#feed{white-space:pre-wrap;word-break:break-word}
.line{opacity:.92}
.ok{color:var(--phos)}
.warnl{color:var(--amber)}
.crit{color:var(--red)}
.dim{color:var(--phos-dim)}
#cursor{display:inline-block;width:9px;height:16px;background:var(--phos);
  vertical-align:-3px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}

/* Brief card — the signature panel */
#brief{margin-top:34px;border:1px solid var(--phos-dim);background:
  linear-gradient(var(--panel),var(--panel)) padding-box;
  padding:0;opacity:0;transform:translateY(14px);transition:opacity .6s,transform .6s}
#brief.up{opacity:1;transform:none}
#brief h2{background:var(--phos-dim);color:var(--void);font-size:12px;
  letter-spacing:.3em;padding:7px 14px;font-weight:400}
.rows{padding:6px 0}
.row{display:grid;grid-template-columns:132px 1fr;gap:10px;padding:9px 14px;
  border-bottom:1px dashed rgba(47,111,133,.4)}
.row:last-child{border-bottom:0}
.row .k{color:var(--phos-dim);font-size:11px;letter-spacing:.16em;padding-top:3px}
.row .v{color:var(--bone);font-size:15px}
.row .v strong{color:var(--amber);font-weight:400}
ul{list-style:none}
li::before{content:"▸ ";color:var(--phos-dim)}

.actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.btn{border:1px solid var(--amber);color:var(--amber);background:transparent;
  padding:13px 22px;font-family:inherit;font-size:13px;letter-spacing:.2em;
  cursor:pointer;text-decoration:none;display:inline-block}
.btn:hover,.btn:focus{background:var(--amber);color:var(--void)}
.btn.sec{border-color:var(--phos-dim);color:var(--phos-dim)}
.btn.sec:hover,.btn.sec:focus{background:var(--phos-dim);color:var(--void)}
:focus-visible{outline:2px solid var(--bone);outline-offset:3px}

#ytdock{position:fixed;bottom:14px;right:14px;z-index:55;width:216px;
  border:1px solid var(--phos-dim);background:var(--void)}
.ythead{display:flex;justify-content:space-between;align-items:center;
  padding:5px 8px;border-bottom:1px solid var(--phos-dim);
  font-size:10px;letter-spacing:.2em;color:var(--phos-dim)}
#audioctl{border:0;background:transparent;color:var(--phos-dim);font-family:inherit;
  font-size:10px;letter-spacing:.18em;cursor:pointer;padding:2px 4px}
#audioctl:hover{color:var(--amber)}
#ytplayer{width:216px;height:122px;display:block}
#ytplayer iframe{display:block;filter:saturate(.55) contrast(1.05)}
@media (max-width:520px){
  #ytdock{width:150px;bottom:10px;right:10px}
  #ytplayer{width:150px;height:85px}
}

@media (max-width:520px){
  body{font-size:13px}
  .row{grid-template-columns:1fr;gap:2px}
  main{padding:20px 14px 110px}
}
@media (prefers-reduced-motion:reduce){
  .flick{display:none}
  #cursor{animation:none}
  #brief{transition:none}
}
</style>
</head>
<body>
<div class="scan"></div><div class="vig"></div><div class="flick"></div>

<div id="gate">
  <div class="crest">U N S C &nbsp; N A V S P E C W A R</div>
  <h1>PRIORITY TRANSMISSION</h1>
  <p class="warn">This terminal is monitored. Unauthorized access is punishable under
     UNSC Article 27. Audio playback will begin on authorization.</p>
  <button class="key" id="startBtn">AUTHORIZE ▸</button>
</div>

<main aria-live="polite">
  <div class="bar">
    <span>ONI // SECTION III</span>
    <span id="stamp">— — —</span>
    <span>CLEARANCE: <span style="color:var(--amber)">DELTA</span></span>
  </div>
  <div id="feed"></div><span id="cursor"></span>

  <section id="brief" aria-hidden="true">
    <h2>OPERATION DOSSIER</h2>
    <div class="rows" id="rows"></div>
  </section>

  <div class="actions" id="actions" style="display:none">
    <a class="btn" id="mapbtn" href="#" target="_blank" rel="noopener">NAV COORDINATES</a>
  </div>
</main>

<audio id="track" loop preload="auto"></audio>

<div id="ytdock" hidden>
  <div class="ythead">
    <span>◉ AUDIO FEED</span>
    <button id="audioctl" title="Mute / unmute">MUTE</button>
  </div>
  <div id="ytplayer"></div>
</div>

<script>
/* ============================================================
   1. YOUR EVENT DETAILS — edit these
   ============================================================ */
const OP = {
  name:      "OPERATION BROWN LIGHTNING",
  alias:     "A.K.A. ARMAAN PEW PEW PARTY FUN TIME",
  date:      "Saturday, 12 September",
  time:      "1030 hrs",
  location:  "162 O'Haire Rd, Middletown, NY 10941",
  mapUrl:    "https://www.google.com/maps/search/?api=1&query=MSG+Paintball+162+O%27Haire+Rd+Middletown+NY+10941",
  cost:      "$50 per operative — entry, mask, 500 rounds",
  loadout:   ["Long sleeves + long pants (mandatory)","Closed-toe boots","Gloves","Water — 2L minimum"],
  squad:     "18 operatives. Two fireteams.",
  callsign:  "NOBLE ACTUAL",

  /* TYPING SPEED — higher = slower. 1 = original, 1.5 = current, 4 = very slow. */
  speed:     1.5,

  /* MUSIC — mp3 takes priority. Drop the file next to index.html and put
     its filename here. Leave "" to fall back to the YouTube embed below. */
  musicSrc:  "Winter_Contingency.mp3",

  youtubeId: "g_OAjpbXRj4",   // used only if musicSrc is ""
  startAt:   0,      // seconds into the track to begin
  volume:    55      // 0-100
};

/* ============================================================
   2. BOOT SEQUENCE SCRIPT — original copy, edit freely
   ============================================================ */
const SEQ = [
  ["> establishing uplink ...",'dim',14],
  ["  slipspace relay ......... [ SYNCED ]",'ok',10],
  ["  encryption ............... AES-1024",'dim',10],
  ["  decrypting packet 1 of 1 ...",'dim',14],
  ["",'',0],
  ["!! PRIORITY SIGMA — EYES ONLY !!",'crit',26],
  ["",'',0],
  ["FROM: "+OP.callsign,'warnl',14],
  ["TO:   ALL LISTED OPERATIVES",'warnl',14],
  ["",'',0],
  ["Contact reported at the objective. Local defense",'',12],
  ["is nonexistent. Command is authorizing a full",'',12],
  ["squad insertion at first light.",'',12],
  ["",'',0],
  ["  weapons check ............ [ PAINT ]",'ok',12],
  ["  casualty forecast ........ [ BRUISES ONLY ]",'ok',12],
  ["  threat assessment ........ [ YOUR FRIENDS ]",'ok',12],
  ["",'',0],
  ["> decrypting dossier ...",'dim',18]
];

/* ============================================================ */
const feed=document.getElementById('feed'), cursor=document.getElementById('cursor');
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
/* Reduce Motion (iOS Settings > Accessibility > Motion) kills the CRT flicker and
   smooth scroll, but the typing still runs — just a bit quicker. */
const MULT = reduce ? OP.speed*0.6 : OP.speed;
const ctl=document.getElementById('audioctl'), dock=document.getElementById('ytdock');
const audio=document.getElementById('track');
const useMp3=!!OP.musicSrc;

/* ---- YouTube IFrame API (fallback only) ---- */
let yt=null, ytReady=false, pendingPlay=false;
if(!useMp3 && OP.youtubeId){
  const s=document.createElement('script');
  s.src="https://www.youtube.com/iframe_api";
  document.head.appendChild(s);
}
function onYouTubeIframeAPIReady(){
  yt=new YT.Player('ytplayer',{
    videoId:OP.youtubeId,
    playerVars:{
      controls:1, modestbranding:1, rel:0, playsinline:1,
      start:OP.startAt,
      loop:1, playlist:OP.youtubeId   // loop needs playlist set to the same id
    },
    events:{
      onReady:()=>{
        ytReady=true;
        yt.setVolume(OP.volume);
        if(pendingPlay) playMusic();
      },
      onStateChange:e=>{
        if(e.data===YT.PlayerState.ENDED){ yt.seekTo(OP.startAt); yt.playVideo(); }
      }
    }
  });
}
window.onYouTubeIframeAPIReady=onYouTubeIframeAPIReady;

function playMusic(){
  if(useMp3){
    audio.src=OP.musicSrc;
    audio.volume=OP.volume/100;
    audio.currentTime=OP.startAt;
    audio.play().catch(()=>{});
    return;
  }
  if(!OP.youtubeId) return;
  if(!ytReady){ pendingPlay=true; return; }
  dock.hidden=false;
  yt.playVideo();
}

document.getElementById('stamp').textContent =
  new Date().toISOString().slice(0,10).replace(/-/g,'.') + " // UNSC STD";

document.getElementById('startBtn').addEventListener('click', start);
document.getElementById('gate').addEventListener('click', start);
addEventListener('keydown', e=>{ if(document.getElementById('gate').classList.contains('hide')) return;
  if(e.key===' '||e.key==='Enter') start(); });

let started=false;
function start(){
  if(started) return; started=true;
  document.getElementById('gate').classList.add('hide');
  if(useMp3){
    dock.hidden=false;
    document.getElementById('ytplayer').style.display='none';
  }
  playMusic();
  run();
}
ctl.addEventListener('click',()=>{
  if(useMp3){
    audio.muted=!audio.muted;
    ctl.textContent=audio.muted?'UNMUTE':'MUTE';
    return;
  }
  if(!ytReady) return;
  if(yt.isMuted()){ yt.unMute(); ctl.textContent='MUTE'; }
  else { yt.mute(); ctl.textContent='UNMUTE'; }
});

async function run(){
  for(const [text,cls,speed] of SEQ){
    await typeLine(text,cls,speed*MULT);
    await wait((text?260:520)*MULT);
  }
  await progress("DOSSIER");
  cursor.style.display='none';
  renderBrief();
}

function typeLine(text,cls,speed){
  return new Promise(res=>{
    const el=document.createElement('div');
    el.className='line '+(cls||''); feed.appendChild(el);
    if(!speed||!text){ el.textContent=text; return res(); }
    let i=0;
    (function tick(){
      el.textContent=text.slice(0,++i);
      i<text.length ? setTimeout(tick,speed) : res();
    })();
  });
}

function progress(label){
  return new Promise(res=>{
    const el=document.createElement('div'); el.className='line ok'; feed.appendChild(el);
    let p=0;
    const step=()=>{
      p=Math.min(100,p+Math.random()*7+2);
      const f=Math.round(p/4);
      el.textContent=`  ${label} [${'█'.repeat(f)}${'░'.repeat(25-f)}] ${String(Math.floor(p)).padStart(3)}%`;
      const pause=(60+Math.random()*180)*MULT;   // uneven, like a real uplink
      p<100 ? setTimeout(step,pause) : setTimeout(res,700);
    };
    step();
  });
}

function renderBrief(){
  const rows=[
    ["OPERATION", `<strong>${OP.name}</strong>${OP.alias?`<div style="color:var(--phos-dim);font-size:12px;letter-spacing:.12em;margin-top:3px">${OP.alias}</div>`:""}`],
    ["DATE",      OP.date],
    ["H-HOUR",    `<strong>${OP.time}</strong>`],
    ["LZ",        OP.location],
    ["SQUAD",     OP.squad],
    ["REQUISITION", OP.cost],
    ["LOADOUT",   "<ul>"+OP.loadout.map(x=>`<li>${x}</li>`).join("")+"</ul>"],
    ["CLASSIFIED","It's paintball. Bring snacks."]
  ];
  document.getElementById('rows').innerHTML = rows.map(([k,v])=>
    `<div class="row"><div class="k">${k}</div><div class="v">${v}</div></div>`).join("");
  const b=document.getElementById('brief');
  b.setAttribute('aria-hidden','false'); b.classList.add('up');
  const a=document.getElementById('actions'); a.style.display='flex';
  document.getElementById('mapbtn').href=OP.mapUrl;
  b.scrollIntoView({behavior:reduce?'auto':'smooth',block:'nearest'});
}

const wait=ms=>new Promise(r=>setTimeout(r,ms));
</script>
</body>
</html>
